<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>yt-clip</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      #switch-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      #switch-note {
        margin: 2px 0 0 24px;
        color: #606060;
        font-size: 12px;
      }
      #switch-error {
        margin: 6px 0 0;
        color: #c00;
      }
      hr {
        margin: 10px 0;
        border: none;
        border-top: 1px solid #ddd;
      }
      #message {
        margin: 0 0 10px;
        line-height: 1.5;
      }
      #note {
        margin: 0 0 10px;
        line-height: 1.5;
        color: #606060;
      }
      #progress-area {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      #progress {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <!--
      全機能のオン / オフ (マスタースイッチの spec §6.1)。popup が持つ唯一の操作。どの状態でも押せる (disabled を付けない)。
      既定はオンなので checked で始める (読み終えるまでの一瞬にオフに見えないように)
    -->
    <label id="switch-row">
      <input type="checkbox" role="switch" id="enabled" checked />
      yt-clip を使う
    </label>
    <p id="switch-note">この端末だけに効く (同期しない)</p>
    <p id="switch-error" hidden></p>
    <hr />
    <p id="message"></p>
    <p id="note" hidden></p>
    <div id="progress-area" hidden>
      <progress id="progress" value="0" max="1"></progress>
      <span id="remain"></span>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
